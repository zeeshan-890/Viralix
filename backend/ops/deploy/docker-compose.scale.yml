version: '3.9'

services:
  api:
    build:
      context: ../../..
      dockerfile: backend/ops/deploy/Dockerfile
    environment:
      PROCESS_TYPE: api
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_READ_URI: ${MONGODB_READ_URI:-}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      DOMAIN_EVENTS_BACKEND: ${DOMAIN_EVENTS_BACKEND:-kafka}
      KAFKA_DOMAIN_EVENTS_TOPIC: ${KAFKA_DOMAIN_EVENTS_TOPIC:-viralix.domain-events}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '5000:5000'
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  worker:
    build:
      context: ../../..
      dockerfile: backend/ops/deploy/Dockerfile
    command: ['node', 'backend/worker-process.js']
    environment:
      PROCESS_TYPE: worker
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      DOMAIN_EVENTS_BACKEND: ${DOMAIN_EVENTS_BACKEND:-kafka}
      KAFKA_DOMAIN_EVENTS_TOPIC: ${KAFKA_DOMAIN_EVENTS_TOPIC:-viralix.domain-events}
      KAFKA_DOMAIN_EVENTS_CONSUMER: ${KAFKA_DOMAIN_EVENTS_CONSUMER:-1}
      KAFKA_DOMAIN_EVENTS_GROUP_ID: ${KAFKA_DOMAIN_EVENTS_GROUP_ID:-viralix-domain-events}
      JWT_SECRET: ${JWT_SECRET}
      PUBLISH_WORKER_CONCURRENCY: ${PUBLISH_WORKER_CONCURRENCY:-6}
      ANALYTICS_REFRESH_WORKER_CONCURRENCY: ${ANALYTICS_REFRESH_WORKER_CONCURRENCY:-2}
      PLATFORM_SYNC_WORKER_CONCURRENCY: ${PLATFORM_SYNC_WORKER_CONCURRENCY:-3}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  kafka:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - '1'
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092
    ports:
      - '9092:9092'
