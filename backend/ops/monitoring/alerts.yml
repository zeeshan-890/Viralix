groups:
  - name: viralix_backend_alerts
    rules:
      - alert: ViralixBackendHighErrorRate
        expr: sum(rate(viralix_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(viralix_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend 5xx rate is above 5%"
          description: "Viralix backend has elevated HTTP 5xx ratio over the last 10 minutes."

      - alert: ViralixPublishQueueLag
        expr: viralix_queue_depth{queue="social-publish",state=~"waiting|delayed"} > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Publish queue lag is high"
          description: "social-publish waiting/delayed jobs exceeded 200 for 10 minutes."

      - alert: ViralixSchedulerNoLockAcquire
        expr: increase(viralix_scheduler_lock_events_total{event="acquire"}[15m]) < 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Scheduler lock not acquired recently"
          description: "No scheduler lock acquisition event detected in the last 15 minutes."

      - alert: ViralixApiP95LatencyHigh
        expr: histogram_quantile(0.95, sum(rate(viralix_http_request_duration_ms_bucket[10m])) by (le)) > 800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency is above SLO"
          description: "Global API p95 latency has exceeded 800ms for the last 10 minutes."

      - alert: ViralixPublishDlqBacklog
        expr: viralix_queue_depth{queue="social-publish-dlq",state="waiting"} > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Publish DLQ backlog is growing"
          description: "social-publish-dlq waiting jobs exceeded 50 for 10 minutes."

      - alert: ViralixQueueFailureRatioHigh
        expr: sum(rate(viralix_queue_jobs_total{status=~"failed|partial_or_failed"}[10m])) / clamp_min(sum(rate(viralix_queue_jobs_total[10m])), 1) > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queue failure ratio is high"
          description: "Combined queue failed/partial job ratio is above 10% over the last 10 minutes."

